apiVersion: v1
kind: ServiceAccount
metadata:
  name: catalog-sa
  namespace: production
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: inventory-sa
  namespace: production
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orders-sa
  namespace: production
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-sa
  namespace: production
---
apiVersion: v1
kind: ServiceAccount
