# ==========================================
# ORDERS SERVICE (.NET / Port 8082) - VAULT
# ==========================================
apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: production
  labels:
    app: orders
spec:
  type: ClusterIP
  ports:
    - port: 8082
      targetPort: 8082
      protocol: TCP
      name: http
  selector:
    app: orders
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: production
  labels:
    app: orders
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "orders-role"
        vault.hashicorp.com/agent-run-as-user: "65532"
        vault.hashicorp.com/agent-run-as-group: "65532"
        vault.hashicorp.com/agent-set-security-context: "true"
        vault.hashicorp.com/agent-inject-secret-config.json: "secret/data/orders/config"
        vault.hashicorp.com/agent-inject-template-config.json: |
          {{- with secret "secret/data/orders/config" -}}
          {
            "apiKey": "{{ .Data.data.api_key }}",
            "catalogAuthToken": "{{ .Data.data.catalog_auth_token }}"
          }
          {{- end -}}
    spec:
      serviceAccountName: orders-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: orders
          image: enterprise/orders:1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: CATALOG_SERVICE_URL
              value: "http://catalog.production.svc.cluster.local:8080"
            - name: INVENTORY_SERVICE_URL
              value: "http://inventory.production.svc.cluster.local:8081"
            - name: PAYMENT_SERVICE_URL
              value: "http://payment.production.svc.cluster.local:8083"
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: DOTNET_EnableDiagnostics
              value: "0"
          ports:
            - containerPort: 8082
              name: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            limits:
              cpu: 300m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
---
# ==========================================
# PAYMENT SERVICE (Java / Port 8083) - VAULT
# ==========================================
apiVersion: v1
kind: Service
metadata:
  name: payment
  namespace: production
  labels:
    app: payment
spec:
  type: ClusterIP
  ports:
    - port: 8083
      targetPort: 8083
      protocol: TCP
      name: http
  selector:
    app: payment
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: production
  labels:
    app: payment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment
  template:
    metadata:
      labels:
        app: payment
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "payment-role"
        vault.hashicorp.com/agent-run-as-user: "65532"
        vault.hashicorp.com/agent-run-as-group: "65532"
        vault.hashicorp.com/agent-set-security-context: "true"
        vault.hashicorp.com/agent-inject-secret-credentials.json: "secret/data/payment/credentials"
        vault.hashicorp.com/agent-inject-template-credentials.json: |
          {{- with secret "secret/data/payment/credentials" -}}
          {
            "merchantId": "{{ .Data.data.merchant_id }}",
            "encryptionKey": "{{ .Data.data.encryption_key }}"
          }
          {{- end -}}
    spec:
      serviceAccountName: payment-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: payment
          image: enterprise/payment:1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification.production.svc.cluster.local:8084"
          ports:
            - containerPort: 8083
              name: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8083
            initialDelaySeconds: 8
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8083
            initialDelaySeconds: 4
            periodSeconds: 5
          resources:
            limits:
              cpu: 400m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
---
